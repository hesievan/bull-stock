# A股牛市热度指数 — 开发环境配置

# V2 引擎配置（与 heat_index_v2.py 同步, YAML 为唯一事实源）
v2_engine:
  weights:
    pe: 0.14
    buffett: 0.14
    margin_ratio: 0.15
    seal_rate: 0.15
    turnover_m2: 0.15
    turnover: 0.12
    new_high: 0.10
    ma_alignment: 0.05
  divergence:
    turnover_threshold: 70
    decline_threshold: -1.5
    penalty_factor: 0.2
    lookback_days: 20
    new_high_penalty: 15
  turnover:
    percentile_window_years: 10
  pe:
    n_stocks_filter_ratio: [0.5, 1.5]
    n_stocks_filter_min: 450
  margin:
    saturation_cutoff: 0.85
    saturation_headroom: 0.15
  new_high:
    threshold: 0.98

# 热度等级阈值（综合热度 0-100）— 与 V2 引擎 / json_writer / 前端同步
heat_levels:
  red:    { min: 65, max: 100, label: "红色预警", color: "#f85149" }
  orange: { min: 55, max: 64,  label: "橙色关注", color: "#e5892a" }
  yellow: { min: 40, max: 54,  label: "黄色警惕", color: "#d29922" }
  green:  { min: 0,  max: 39,  label: "绿色安全", color: "#3fb950" }

# 数据参数
data:
  db_path: "data/heat_index_dev.db"
  request_delay: 1.0
  max_retries: 3

# 飞书通知 — 开发环境不推送
notification:
  feishu_webhook: ""
  notify_on: ["extreme", "hot"]
  notify_on_recovery: true

# 输出
output:
  html_path: "web/index.html"
  json_path: "web/data/latest.json"
