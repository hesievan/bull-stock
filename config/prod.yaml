# A股牛市热度指数 — 生产环境配置

# V2 引擎配置（与 heat_index_v2.py 同步, YAML 为唯一事实源）
v2_engine:
  weights:
    pe: 0.212121
    buffett: 0.212121
    yield_spread: 0.045455
    m1_m2_spread: 0.045455
    margin_buy_ratio: 0.045455
    turnover: 0.136364
    futures_discount: 0.030303
    new_high: 0.181818
    ma_alignment: 0.090909
  divergence:
    turnover_threshold: 70
    decline_threshold: -1.5
    penalty_factor: 0.2
    lookback_days: 20
    new_high_penalty: 15
  percentile:
    rolling_window: 1260
  turnover:
    percentile_window_years: 10
  pe:
    n_stocks_filter_ratio: [0.5, 1.5]
    n_stocks_filter_min: 450
  margin:
    saturation_cutoff: 0.85
    saturation_headroom: 0.15
  new_high:
    threshold: 0.98

# 热度等级阈值（综合热度 0-100）— 与 V2 引擎 / json_writer / 前端同步
# M1.6: 引擎 regime label 与极值信号均读此块 (单一事实源, 消灭引擎内硬编码阈值)。
# 连续展示档仍为 red/orange/yellow/green 四档; extreme_hot/extreme_cold 为叠加信号档
# (extreme_hot ⊂ red 上沿, extreme_cold ⊂ green 下沿), 仅用于极值信号/强提示判定。
heat_levels:
  red:         { min: 65, max: 100, label: "红色预警", color: "#f85149" }
  orange:      { min: 55, max: 64,  label: "橙色关注", color: "#e5892a" }
  yellow:      { min: 40, max: 54,  label: "黄色警惕", color: "#d29922" }
  green:       { min: 0,  max: 39,  label: "绿色安全", color: "#3fb950" }
  extreme_hot: { min: 80, max: 100, label: "极热",     color: "#c2185b" }
  extreme_cold: { min: 0, max: 29,   label: "冰点",     color: "#0d47a1" }

# 数据参数
data:
  db_path: "data/heat_index.db"
  request_delay: 1.0
  max_retries: 3

# 飞书通知 — 通过环境变量 FEISHU_WEBHOOK 设置
notification:
  feishu_webhook: ""
  notify_on: ["extreme", "hot"]
  notify_on_recovery: true

# 输出
output:
  html_path: "web/index.html"
  json_path: "web/data/latest.json"
