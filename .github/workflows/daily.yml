name: Daily Heat Index Update

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        # P2-2 依赖锁定: 依赖单一来源 = pyproject.toml, 锁定产物 = uv.lock (多平台+哈希)。
        # setup-uv 自动缓存 uv 下载; python-version 安装托管 CPython 3.12。
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (locked)
        # uv sync --frozen: 严格按 uv.lock 安装, 不改动锁; 后续步骤通过 GITHUB_PATH 使用 .venv/bin。
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          ruff check
          ruff format --check

      - name: Unit tests
        run: |
          cd ${{ github.workspace }}
          # --cov-fail-under 为覆盖率底线(回归防护), 非目标值。
          # 当前基线约 39%; 随测试补充应逐步调高(45→50→...→70), 避免每日 CI 因未达标而阻断数据更新。
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=38

      # ── 数据库恢复 ──────────────────────────────────────────────────────────
      - name: Restore database from cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/heat_index.db
          key: heat-db-${{ hashFiles('src/data/database.py') }}-${{ github.run_id }}
          restore-keys: |
            heat-db-${{ hashFiles('src/data/database.py') }}-
            heat-db-

      - name: Download seed database from Release
        if: steps.cache-db.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release view seed-db --json assets -q '.assets[].name' 2>/dev/null | grep -q 'heat_index.db.gz'; then
            echo "Downloading seed database from Release..."
            gh release download seed-db --pattern 'heat_index.db.gz' -D data/ --clobber
            python scripts/db_tools.py decompress
          else
            echo "No seed database found in Release. Will run full backfill."
            echo "SEED_MISSING=true" >> $GITHUB_ENV
          fi

      - name: Full backfill (first run only)
        if: env.SEED_MISSING == 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          echo "Running full historical backfill (this may take 30-60 minutes)..."
          python scripts/fetch_tushare_history.py

      # ── 补充数据 ──────────────────────────────────────────────────────────
      - name: Fetch supplementary data (GDP, IPO, etc.)
        if: success()
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/fetch_gdp.py || echo "::warning::GDP fetch skipped/failed (buffett denominator may be stale)"

      # ── 预计算表回填 (缺口自愈) ────────────────────────────────────────────
      # D1 修复: 原 `|| echo "Precompute backfill skipped"` 把失败静默吞掉,
      # 导致坏库/空洞被照常缓存并传播(2026-08-13~09-01 每日 3 FAILED 即此根因)。
      # 现在失败会真实中断 job → 飞书通知失败步骤, 不再静默传播。
      - name: Backfill precompute tables (gap self-heal)
        if: success()
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/backfill_precompute.py

      # ── 日常计算 ────────────────────────────────────────────────────────────
      - name: Run daily update
        # 步骤级超时: 2026-09-01 schedule run 在 runner 出口 IP 被 tushare 限流时
        # 该步骤挂起 20min+ (本地复现仅需 64s)。35min 兜底避免拖满整个 job(55min),
        # 超时后立即失败, 通知步骤仍会执行且日志可快速定位。
        timeout-minutes: 35
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          python scripts/run_daily.py

      # ── 每周 VACUUM (压缩数据库, 周一执行; 重操作, 失败不阻断流水线) ──────
      - name: Weekly VACUUM (Mondays)
        if: success()
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "Monday: running weekly VACUUM..."
            python scripts/db_tools.py vacuum || echo "VACUUM skipped/failed"
          else
            echo "Not Monday, skip VACUUM"
          fi

      # ── 重算全量指标历史 (覆盖 V1 遗留数据, 确保 seal_rate 等全量可用) ──
      - name: Regenerate full indicator history
        if: success()
        run: |
          cd ${{ github.workspace }}
          python scripts/backfill_indicator_history.py || echo "Warning: indicator history regen failed"

      - name: Validate backtest
        if: success()
        run: |
          cd ${{ github.workspace }}
          python scripts/validate_backtest.py --days 5 || echo "Warning: validation failed"

      # ── 保存数据库到 Cache ─────────────────────────────────────────────────
      - name: Save database to cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/heat_index.db
          key: heat-db-${{ hashFiles('src/data/database.py') }}-${{ github.run_id }}

      # ── 保存种子库到 Release (每周一次) ────────────────────────────────────
      - name: Update seed database in Release
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && endsWith(format('{0}', github.run_number), '0')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading seed database to Release..."
          python scripts/db_tools.py compress
          if gh release view seed-db 2>/dev/null; then
            gh release upload seed-db data/heat_index.db.gz --clobber
          else
            gh release create seed-db data/heat_index.db.gz \
              --title "Seed Database" \
              --notes "Auto-updated seed database for GitHub Actions CI" \
              --latest=false
          fi
          echo "Seed database uploaded successfully"

      # ── 持久化 JSON 数据到仓库 ──────────────────────────────────────────
      - name: Commit JSON data back to repo
        if: success()
        run: |
          if [ -z "$(git status web/data/ --porcelain)" ]; then
            echo "No changes to JSON data, skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/
          git commit -m "chore: update heat index data for $(date -u '+%Y-%m-%d') [skip ci]"

          # 并发场景：定时运行与手动触发的运行可能同时生成同一天的 JSON。
          # rebase 冲突时用 -X theirs 自动采用本次运行刚生成的数据
          # （rebase 中 theirs = 被重放的本地提交）。最多重试 3 轮 push。
          PUSHED=0
          for attempt in 1 2 3; do
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              # 上一轮留下了未完成的 rebase（偶发冲突），强制取用本地版本后续跑
              git checkout --theirs -- web/data/ 2>/dev/null || true
              git add web/data/
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort 2>/dev/null || true
                echo "Rebase failed on attempt $attempt, will retry"
                sleep 5
                continue
              fi
            else
              if ! git pull --rebase --autostash -X theirs; then
                echo "Rebase conflict on attempt $attempt, will resolve and retry"
                sleep 5
              fi
            fi
            if git push; then
              PUSHED=1
              break
            fi
            echo "Push failed on attempt $attempt, will pull latest and retry"
            sleep 5
          done

          if [ "$PUSHED" -ne 1 ]; then
            git rebase --abort 2>/dev/null || true
            echo "Failed to commit and push JSON data after 3 attempts" >&2
            exit 1
          fi
          echo "JSON data committed and pushed"

      # ── 部署到 GitHub Pages ──────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── 飞书通知 ───────────────────────────────────────────────────────────
      - name: Send Feishu notification if red
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 收集本次 job 已执行步骤中结论为 failure 的步骤名。
          # 被 `|| echo skipped` 吞掉的软失败在 GitHub 侧仍是 success, 不在其中
          # (软失败靠 run_daily 的 data_quality 与数据新鲜度在通知正文中体现)。
          FAILED_STEPS=""
          if [ "${{ job.status }}" != "success" ]; then
            FAILED_STEPS=$(python scripts/ci_failed_steps.py)
          fi

          MSG=""
          if [ -f web/data/notification.txt ]; then
            MSG=$(cat web/data/notification.txt)
          fi

          if [ "${{ job.status }}" != "success" ]; then
            HEADER="⚠️ A股热度指数每日流水线: ${{ job.status }}"
            if [ -n "$FAILED_STEPS" ]; then
              HEADER="$HEADER | 失败步骤: $FAILED_STEPS"
            fi
            MSG=$(printf '%s\n%s' "$HEADER" "$MSG")
          fi

          if [ -n "${{ secrets.FEISHU_WEBHOOK }}" ] && [ -n "$MSG" ]; then
            curl -s -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}"
          fi

  # ── P0.3: Lighthouse 质量门禁 (对已部署的 Pages 站评分; 失败不阻断数据流水线) ──
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: update
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Pages deployment
        run: sleep 60

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun --config-file=lighthouserc.json || echo "Warning: Lighthouse assertions failed (non-blocking, review scores)"
